
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the Smart Canteen Menu, view food items, prices, and availability.">
    <title>Smart Canteen Menu</title>
</head>
<body>

    <header>
        <h1>🍽️ Smart Canteen Menu</h1>
        <p>Your campus food, all in one place!</p>
    </header>

    <main>

        <section id="welcome">
            <h2>Welcome to Our Canteen</h2>
            <p>Discover delicious food at affordable prices.</p>
        </section>

        <section id="menu-section">
            <h2>Today's Menu</h2>

            <form id="search-form">
                <label for="search-input">Search food items</label>
                <input
                    type="search"
                    id="search-input"
                    placeholder="Search for food..."
                >

                <label for="category-filter">Filter by category</label>
                <select id="category-filter">
                    <option value="all">All Categories</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Snacks">Snacks</option>
                    <option value="Drinks">Drinks</option>
                </select>

                <button type="submit">Search</button>
            </form>

            <p id="menu-status" role="status" aria-live="polite">
                Loading menu...
            </p>

            <div id="menu-container">
                <!-- Food items will be displayed here using JavaScript. -->
            </div>
        </section>

        <section id="admin-section">
            <h2>Manage Menu</h2>
            <p>Add or update food items in the canteen menu.</p>

            <form id="menu-form">

                <input type="hidden" id="item-id">

                <div>
                    <label for="item-name">Food Name</label>
                    <input
                        type="text"
                        id="item-name"
                        maxlength="100"
                        placeholder="e.g. Vegetable Biryani"
                        required
                    >
                </div>

                <div>
                    <label for="item-description">Description</label>
                    <textarea
                        id="item-description"
                        maxlength="300"
                        placeholder="Describe the food item"
                    ></textarea>
                </div>

                <div>
                    <label for="item-category">Category</label>
                    <select id="item-category" required>
                        <option value="">Select a category</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Snacks">Snacks</option>
                        <option value="Drinks">Drinks</option>
                    </select>
                </div>

                <div>
                    <label for="item-price">Price (₹)</label>
                    <input
                        type="number"
                        id="item-price"
                        min="0.01"
                        max="100000"
                        step="0.01"
                        placeholder="e.g. 50"
                        required
                    >
                </div>

                <div>
                    <label for="item-image">Image URL (optional)</label>
                    <input
                        type="url"
                        id="item-image"
                        placeholder="https://example.com/food.jpg"
                    >
                </div>

                <div>
                    <label for="item-availability">Availability</label>
                    <select id="item-availability">
                        <option value="true">Available</option>
                        <option value="false">Not Available</option>
                    </select>
                </div>

                <button type="submit" id="save-button">
                    Add Food Item
                </button>

                <button type="button" id="cancel-button" hidden>
                    Cancel Edit
                </button>

            </form>

            <p id="form-status" role="status" aria-live="polite"></p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Smart Canteen Menu | College Canteen Management</p>
    </footer>
<script src="script.js" defer></script>
</body>
</html>
